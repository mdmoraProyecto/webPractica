<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VClip de vídeo incustrado en HTML 5</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <video width="640" height="480" controls autoplay loop muted poster="poster.jpg" preload="auto">
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
        <source src="video.ogg" type="video/ogg">
        Your browser does not support the video tag.
    </video>
</body>
</html>
